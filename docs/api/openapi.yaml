openapi: 3.1.0
info:
  title: Union Ledger API
  version: 0.1.0
  description: |
    Union Ledger MVP API 초안입니다.
    상세 엔드포인트 인벤토리는 `docs/api/mvp-api-spec.md`를 기준으로 하고,
    이 문서는 우선 구현할 핵심 흐름 중심의 OpenAPI 계약을 제공합니다.
servers:
  - url: http://localhost:8000/api/v1
tags:
  - name: Auth
  - name: Identity
  - name: Organizations
  - name: Templates
  - name: Settlements
  - name: Evidences
  - name: Reconciliation
  - name: Audit
  - name: Public
  - name: Notifications
paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Sign up with university email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignUpRequest'
      responses:
        '201':
          description: Signup accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthPendingResponse'
  /auth/verify-email:
    post:
      tags: [Auth]
      summary: Verify university email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /me:
    get:
      tags: [Identity]
      summary: Get current user profile
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations available to current user
      responses:
        '200':
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
  /organizations/{organizationId}/templates:
    post:
      tags: [Templates]
      summary: Upload blank settlement template
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [name, file]
              properties:
                name:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Template uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementTemplate'
  /organizations/{organizationId}/settlements:
    get:
      tags: [Settlements]
      summary: List settlements for organization
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Settlement list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
    post:
      tags: [Settlements]
      summary: Create settlement for academic term
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSettlementRequest'
      responses:
        '201':
          description: Settlement created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settlement'
  /settlements/{settlementId}:
    get:
      tags: [Settlements]
      summary: Get settlement detail
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Settlement detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettlementDetail'
  /settlements/{settlementId}/evidences:
    get:
      tags: [Evidences]
      summary: List evidences for settlement
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Evidence list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Evidence'
    post:
      tags: [Evidences]
      summary: Upload evidence file
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [evidenceType, file]
              properties:
                evidenceType:
                  $ref: '#/components/schemas/EvidenceType'
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Evidence uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
  /evidences/{evidenceId}/extract:
    post:
      tags: [Evidences]
      summary: Trigger OCR or PDF text extraction
      parameters:
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '202':
          description: Extraction started
  /settlements/{settlementId}/reconciliation:
    get:
      tags: [Reconciliation]
      summary: List evidence-to-bank match results
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '200':
          description: Match results
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReconciliationResult'
  /audit/settlements:
    get:
      tags: [Audit]
      summary: List settlements visible to auditor
      responses:
        '200':
          description: Audit settlement queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
  /audit/settlements/{settlementId}/approve:
    post:
      tags: [Audit]
      summary: Approve settlement
      parameters:
        - $ref: '#/components/parameters/SettlementId'
      responses:
        '202':
          description: Settlement approved
  /public/settlements:
    get:
      tags: [Public]
      summary: List approved settlements for student viewer
      responses:
        '200':
          description: Public settlements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Settlement'
  /notifications:
    get:
      tags: [Notifications]
      summary: List in-app notifications
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
components:
  parameters:
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SettlementId:
      name: settlementId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvidenceId:
      name: evidenceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    SignUpRequest:
      type: object
      required: [email, name]
      properties:
        email:
          type: string
          format: email
        name:
          type: string
    VerifyEmailRequest:
      type: object
      required: [email, verificationCode]
      properties:
        email:
          type: string
          format: email
        verificationCode:
          type: string
    AuthPendingResponse:
      type: object
      required: [email, verificationRequired]
      properties:
        email:
          type: string
          format: email
        verificationRequired:
          type: boolean
    UserProfile:
      type: object
      required: [id, email, universityEmailVerified, memberships]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        universityEmailVerified:
          type: boolean
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/OrganizationMembership'
    CreateOrganizationRequest:
      type: object
      required: [collegeName, departmentName, name]
      properties:
        collegeName:
          type: string
        departmentName:
          type: string
        name:
          type: string
    Organization:
      type: object
      required: [id, collegeName, departmentName, name]
      properties:
        id:
          type: string
          format: uuid
        collegeName:
          type: string
        departmentName:
          type: string
        name:
          type: string
    OrganizationMembership:
      type: object
      required: [organizationId, userId, role]
      properties:
        organizationId:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        role:
          $ref: '#/components/schemas/RoleType'
        isPrimary:
          type: boolean
    SettlementTemplate:
      type: object
      required: [id, organizationId, name, originalFilename, mappingSchema]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        name:
          type: string
        originalFilename:
          type: string
        mappingSchema:
          type: object
          additionalProperties: true
    CreateSettlementRequest:
      type: object
      required: [academicYear, semester, title]
      properties:
        academicYear:
          type: integer
        semester:
          type: string
        title:
          type: string
        templateId:
          type: string
          format: uuid
    Settlement:
      type: object
      required: [id, organizationId, academicYear, semester, title, status]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        academicYear:
          type: integer
        semester:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/SettlementStatus'
        submittedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
    SettlementDetail:
      allOf:
        - $ref: '#/components/schemas/Settlement'
        - type: object
          properties:
            evidences:
              type: array
              items:
                $ref: '#/components/schemas/Evidence'
    Evidence:
      type: object
      required: [id, settlementId, evidenceType, status, sourceFileName]
      properties:
        id:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        evidenceType:
          $ref: '#/components/schemas/EvidenceType'
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        sourceFileName:
          type: string
        evidenceDate:
          type: string
          format: date
        merchantName:
          type: string
        amount:
          type: number
          format: double
        paymentMethod:
          $ref: '#/components/schemas/PaymentMethod'
        budgetCategory:
          type: string
        extractedPayload:
          type: object
          additionalProperties: true
    ReconciliationResult:
      type: object
      required: [id, settlementId, status]
      properties:
        id:
          type: string
          format: uuid
        settlementId:
          type: string
          format: uuid
        evidenceId:
          type: string
          format: uuid
        bankTransactionId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/MatchStatus'
        notes:
          type: string
    Notification:
      type: object
      required: [id, notificationType, title, body]
      properties:
        id:
          type: string
          format: uuid
        notificationType:
          $ref: '#/components/schemas/NotificationType'
        title:
          type: string
        body:
          type: string
        readAt:
          type: string
          format: date-time
    RoleType:
      type: string
      enum: [student, treasurer, auditor, admin]
    SettlementStatus:
      type: string
      enum: [draft, ready_for_review, submitted, under_audit, approved, rejected, resubmitted]
    EvidenceType:
      type: string
      enum: [physical_receipt, bank_transfer_statement, e_receipt]
    EvidenceStatus:
      type: string
      enum: [uploaded, extracting, needs_review, confirmed, failed]
    PaymentMethod:
      type: string
      enum: [card, bank_transfer, online_payment, other]
    MatchStatus:
      type: string
      enum:
        - matched
        - amount_mismatch
        - date_mismatch
        - missing_bank_transaction
        - missing_evidence
        - manually_resolved
    NotificationType:
      type: string
      enum:
        - settlement_submitted
        - audit_approved
        - audit_rejected
        - settlement_resubmitted
        - settlement_published
